# ESP32-S3-DevKitC (procpu) settings for lesson_6, applied on top of prj.conf.

# on hardware send the CTF stream over the UART chosen as zephyr,tracing-uart (usb_serial).
CONFIG_TRACING_BACKEND_UART=y

# Debug-friendly code for stepping with GDB/OpenOCD
# CONFIG_DEBUG_OPTIMIZATIONS=y

# Lets OpenOCD (-rtos Zephyr) show Zephyr threads in GDB / VS Code
CONFIG_DEBUG_THREAD_INFO=y
